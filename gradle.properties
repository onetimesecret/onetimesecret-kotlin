# Project coordinates. The version is the single source of truth for releases:
# `release.yml` refuses to publish a tag that does not match it.
GROUP=com.onetimesecret
POM_ARTIFACT_ID=onetimesecret-kotlin
VERSION_NAME=0.1.0

# Gradle performance
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

# Kotlin
kotlin.code.style=official
