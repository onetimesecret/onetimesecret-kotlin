name: Feature request
description: Propose an addition or change to the SDK
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: Sketch what the call would look like from an app.
      render: kotlin
